<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PepeFelipe</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    .embed-window { position: fixed; inset: 0; overflow: hidden; }
    iframe {
      position: absolute;
      top: 0;
      left: -200px; /* Increase/decrease this value to crop more/less from the left */
      width: calc(100% + 200px);
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <main class="embed-window">
    <iframe
      src="https://pepefelipe.com/"
      title="PepeFelipe"
      allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>
</body>
</html>
